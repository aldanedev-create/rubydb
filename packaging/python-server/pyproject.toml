[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rubydb-server"
dynamic = ["version"]
description = "Portable RubyDB runtime and local development server for Python"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Aldane Hutchinson"}]
dependencies = ["rubydb-python>=0.1.1,<0.2"]

[project.urls]
Repository = "https://github.com/aldanedev-create/rubydb"

[project.scripts]
rubydb-server = "rubydb_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rubydb_server = ["server.rb", "bundle.zip", "bundle.json"]

[tool.setuptools.dynamic]
version = {attr = "rubydb_server._version.__version__"}
