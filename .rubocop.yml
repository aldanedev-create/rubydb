inherit_gem:
  standard: config/base.yml

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'exe/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
    - 'test/fixtures/**/*'
    - 'fuzz/**/*'

# Ruby 4.0 modern features
Style/HashSyntax:
  EnforcedShorthandSyntax: either

Style/EndlessMethod:
  Enabled: true
  EnforcedStyle: allow_single_line

Lint/ShadowingOuterLocalVariable:
  Enabled: false

# Several service objects declare a cheap reader with attr_reader and later
# replace it with a synchronized, computed stats method. The explicit method
# is the intended public API; RuboCop's duplicate-method warning is expected.
Lint/DuplicateMethods:
  Enabled: false

Metrics/ClassLength:
  Max: 200

Metrics/MethodLength:
  Max: 25

Metrics/BlockLength:
  Max: 50
  Exclude:
    - 'spec/**/*'
    - 'test/**/*'
    - '*.gemspec'

Naming/FileName:
  Exclude:
    - 'lib/rubydb.rb'

Layout/EndOfLine:
  EnforcedStyle: lf
